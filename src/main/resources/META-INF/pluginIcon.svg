<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Clean AVIF Diamond Logo -->
  <g transform="translate(1, 0)">
    <!-- Yellow Left Polygon -->
    <polygon points="4,20 20,4 20,36" fill="#EEA22A"/>

    <!-- Magenta Right Polygon -->
    <polygon points="20,4 36,20 20,36" fill="#B32368"/>

    <!-- "AV" Text (Left Side - Dark) -->
    <text x="10" y="23.5" font-family="system-ui, -apple-system, Arial-Black, sans-serif" font-weight="900" font-size="9.5" fill="#0E0E0E" letter-spacing="-0.5">AV</text>
    
    <!-- "IF" Text (Right Side - White) -->
    <text x="21" y="23.5" font-family="system-ui, -apple-system, Arial-Black, sans-serif" font-weight="900" font-size="9.5" fill="#FFFFFF" letter-spacing="-0.5">IF</text>
  </g>
</svg>
